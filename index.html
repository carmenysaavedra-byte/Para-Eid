<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Eider — Feliz Cumpleaños</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at 20% 20%, rgba(90,60,40,.18) 0 2px, transparent 3px),radial-gradient(circle at 70% 70%, rgba(90,60,40,.12) 0 2px, transparent 3px),#17120f; color:#24190f; font-family:"VT323",monospace; image-rendering:pixelated; overflow:hidden; }
  .scene{width:min(1120px,96vw);text-align:center}.book{position:relative;width:100%;max-width:1000px;height:min(650px,72vh);min-height:460px;margin:auto;display:flex;filter:drop-shadow(0 22px 20px rgba(0,0,0,.55));perspective:1800px}.cover{position:absolute;inset:0;background:linear-gradient(90deg,#3a2415,#6c4324 4%,#5b351c 48%,#442716 52%,#6a4022 96%,#332014);border:8px solid #21150e;box-shadow:inset 0 0 0 4px #8b5b32,inset 0 0 35px rgba(0,0,0,.5);border-radius:8px}.pages{position:absolute;inset:18px;display:flex;overflow:hidden;border:4px solid #392516;box-shadow:inset 0 0 35px rgba(0,0,0,.35);background:#cbb88d}.page{width:50%;height:100%;padding:clamp(38px,6vw,68px) clamp(30px,5vw,60px);position:relative;background:radial-gradient(circle at 25% 30%,rgba(100,70,35,.08) 0 2px,transparent 3px),radial-gradient(circle at 80% 65%,rgba(100,70,35,.07) 0 2px,transparent 3px),linear-gradient(#e0d0a7,#d5c399);overflow:hidden}.page.left{border-right:3px solid #a18a62;box-shadow:inset -12px 0 20px rgba(60,40,20,.12)}.page.right{box-shadow:inset 12px 0 20px rgba(60,40,20,.12)}.page:before,.page:after{content:"";position:absolute;width:22px;height:22px;border:3px solid rgba(100,70,35,.35)}.page:before{top:13px;left:13px;border-right:0;border-bottom:0}.page:after{bottom:13px;right:13px;border-left:0;border-top:0}.content{position:relative;z-index:2;height:100%;overflow:auto;scrollbar-width:thin;scrollbar-color:#8b754f transparent}h1,h2{margin:0 0 22px;color:#3a2615;text-shadow:1px 1px #eadbb7;line-height:1}h1{font-size:clamp(38px,5vw,62px)}h2{font-size:clamp(28px,3vw,42px)}p{margin:0 0 17px;font-size:clamp(20px,2vw,28px);line-height:1.13;text-align:left}.center p,.center{text-align:center}.cover-title{margin-top:0;font-size:clamp(48px,6vw,78px)}.subtitle{font-size:clamp(23px,3vw,34px);color:#65472c}.pixel-heart{display:inline-block;font-family:monospace;font-size:42px;margin:15px 0;color:#7b2f2f;text-shadow:4px 0 #5b2222}.controls{margin-top:18px;display:flex;justify-content:center;align-items:center;gap:16px}button{font-family:"VT323",monospace;font-size:28px;color:#fff;background:#3b3027;border:4px solid #17120f;box-shadow:inset 0 0 0 2px #76604d,4px 4px 0 #0b0907;padding:6px 18px;cursor:pointer}button:hover{background:#514338}button:active{transform:translate(2px,2px);box-shadow:inset 0 0 0 2px #76604d,2px 2px 0 #0b0907}button:disabled{opacity:.35;cursor:default}#counter{color:#d8c39b;font-size:26px;min-width:100px}.hint{color:#a8916f;margin-top:10px;font-size:19px}.page-spread{display:flex;width:100%;height:100%}.spread-enter .left{animation:leftIn .35s ease}.spread-enter .right{animation:rightIn .35s ease}@keyframes leftIn{from{transform:rotateY(8deg);opacity:.4}to{transform:rotateY(0);opacity:1}}@keyframes rightIn{from{transform:rotateY(-8deg);opacity:.4}to{transform:rotateY(0);opacity:1}}@media(max-width:700px){.book{height:72vh;min-height:430px}.page{padding:30px 22px}p{font-size:19px}h2{font-size:27px}}
</style>
</head>
<body>
<div class="scene"><div class="book"><div class="cover"></div><div class="pages"><div id="spread" class="page-spread"><section class="page left"><div class="content" id="leftPage"></div></section><section class="page right"><div class="content" id="rightPage"></div></section></div></div></div><div class="controls"><button id="prev" onclick="changeSpread(-1)">◀ ANTERIOR</button><span id="counter">1 / 10</span><button id="next" onclick="changeSpread(1)">SIGUIENTE ▶</button></div><div class="hint">un pequeño libro hecho especialmente para vos</div></div>
<script>
const pages=[
`<div class="center" style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;"><div class="pixel-heart">♥</div><h1 class="cover-title">Para Eider</h1><p class="subtitle">Feliz cumpleaños</p><p class="subtitle">Made By: Noe</p></div>`,
`<h2>Eider...</h2><p>Sabés que soy de escribir mucho cuando me expreso, así que bancatela uwu.</p><p>La verdad que no sabía qué escribirte. Pensaba dejar solamente la build y ya, pero no me convencía del todo, y vos sabés que soy más sentimental que no sé qué, así que sí o sí tenía que hacer alguna otra cosa.</p>`,
`<p>Feliz cumple Eid.</p><p>De verdad te deseo todo lo mejor, porque vos te lo merecés. Espero que pases un día lindo, que estés rodeada de gente que te quiere y que puedas disfrutar mucho este nuevo año para vos.</p>`,
`<p>Vos sabés lo mucho que te llegué a amar y el gran cariño que todavía te tengo, y creo que ese cariño no se va a ir así nomás.</p><p>Hemos pasado varias cosas juntas, algunas muy lindas y otras no tanto, pero siempre trato de quedarme con las buenas, porque siento que esas terminan ganándole a las malas.</p>`,
`<p>Vivimos momentos que capaz en su momento no pensé que iban a significar tanto para mí, pero ahora cuando miro para atrás me doy cuenta de que fueron importantes.</p><p>Desde las cosas más tontas hasta esas conversaciones que se nos hicieron eternas, cada una terminó formando parte de una etapa que voy a recordar.</p>`,
`<p>Y aunque las cosas hayan cambiado entre nosotras, no significa que todo lo vivido deje de importar.</p><p>Al contrario, creo que hay personas que llegan a tu vida y, aunque después todo tome caminos distintos, dejan algo que se queda con vos.</p>`,
`<p>Así que nada, quería que esta pequeña build tuviera también un poquito de mí. Capaz no es la gran cosa, pero la hice pensando en vos y en que quería darte algo que pudieras guardar como un pequeño recuerdo.</p>`,
`<p>Gracias por todos los momentos, por las risas, por las conversaciones, por las veces que estuvimos ahí la una para la otra y hasta por las cosas que no salieron bien, porque de todo se aprende algo.</p><p>Al final, todo eso también forma parte de nuestra historia.</p>`,
`<p>Espero que este nuevo año de tu vida venga con muchas cosas lindas, nuevos momentos, personas que te hagan bien y muchas razones para sonreír.</p><p>Ojalá puedas disfrutar muchísimo todo lo que venga y que este cumpleaños sea apenas el comienzo de algo lindo.</p>`,
`<div class="center"><div class="pixel-heart">♥</div><h2>Feliz cumpleaños, Eid</h2><p>Espero que cuando veas todo esto entiendas que lo hice con cariño, porque quería darte algo un poquito más especial que simplemente decirte feliz cumple.</p><p>Gracias por haber sido una parte tan importante de mi vida.</p><p><b>Y ahora sí...</b></p><p>Terminá de leer todo esto que me esforcé, no seas vaga 😭</p><p><b>Feliz cumple, Eid.</b></p><p>Te deseo de corazón todo lo mejor.</p><p><b>Y te quiero con todo mi corazón.</b></p></div>`
];
let current=0;
function render(){const left=pages[current];const right=pages[current+1]||`<div class="center"><p>Fin ♡</p></div>`;document.getElementById("leftPage").innerHTML=left;document.getElementById("rightPage").innerHTML=right;document.getElementById("counter").textContent=`${current+1} / ${pages.length}`;document.getElementById("prev").disabled=current===0;document.getElementById("next").disabled=current>=pages.length-2;const spread=document.getElementById("spread");spread.classList.remove("spread-enter");void spread.offsetWidth;spread.classList.add("spread-enter")}
function changeSpread(direction){const next=current+direction*2;if(next<0||next>=pages.length)return;current=next;render()}
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")changeSpread(1);if(e.key==="ArrowLeft")changeSpread(-1)});
render();
</script>
</body>
</html>
